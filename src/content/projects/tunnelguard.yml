name: TunnelGuard
description:
O TunnelGuard é um sistema web voltado para a área de Redes de Computadores, focado no monitoramento e gestão de infraestrutura de rede. O projeto centraliza a visualização do status e do tráfego de túneis VPN Site-to-Site entre a matriz de uma organização e suas filiais remotas, permitindo ao time de NOC acompanhar disponibilidade, desempenho e dispositivos conectados em cada ponta da rede.

Projeto acadêmico desenvolvido para a disciplina de Redes de Computadores, na etapa de definição e prototipação de interface.
