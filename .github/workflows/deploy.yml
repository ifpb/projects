name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      # O prebuild baixa ~85 MB de previews de repositórios de terceiros. O cache evita
      # refazer isso a cada deploy; o manifesto dentro dele garante que só o que mudou
      # de URL é rebaixado.
      - name: Cache dos previews de projeto
        uses: actions/cache@v4
        with:
          path: src/assets/previews
          key: previews-${{ hashFiles('src/content/projects/**/*.yml') }}
          restore-keys: previews-
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22 # o Astro 6+ exige Node >= 22.12.0
          # path: . # The root location of your Astro project inside the repository. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
